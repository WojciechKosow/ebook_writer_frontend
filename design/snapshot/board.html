<meta charset="utf-8">
<title>Scrivetta Screen Board</title>
<style>
/* Layout: a pannable, zoomable canvas of real-size screen frames, grouped in rows by section, with a layers sidebar. */
:root {
  --canvas: #e4e3e0;
  --panel: #fbfaf8;
  --ink: #1d1c1a;
  --muted: #6d6a64;
  --line: #d6d3cd;
  --accent: #3b5bdb;
  --frame-label: #55524c;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #1e1e20; --panel: #2a2a2d; --ink: #ecebe8; --muted: #a09d97; --line: #3a3a3e; --accent: #7c95f2; --frame-label: #b4b1ab; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #1e1e20; --panel: #2a2a2d; --ink: #ecebe8; --muted: #a09d97; --line: #3a3a3e; --accent: #7c95f2; --frame-label: #b4b1ab; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 13px/1.4 var(--font-ui); overflow: hidden; }
.app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
aside h1 { font-size: 14px; margin: 0; font-weight: 600; }
aside p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
.brief { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--canvas); font-size: 12px; line-height: 1.5; }
.brief b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.brief p { margin: 0 0 6px; color: var(--ink); }
.layers { overflow: auto; padding: 6px 0 16px; flex: 1; }
.layers h2 { font: 600 10.5px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 16px 6px; }
.layers button { display: flex; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; padding: 5px 16px; cursor: pointer; }
.layers button:hover, .layers button:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); outline: none; }
.layers button span:last-child { color: var(--muted); font: 11px var(--font-mono); white-space: nowrap; }
.stage { position: relative; overflow: hidden; cursor: grab; min-width: 0; }
.stage.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.section-title { position: absolute; font: 600 64px/1 var(--font-ui); color: var(--frame-label); white-space: nowrap; }
.frame { position: absolute; }
.frame .label { position: absolute; bottom: 100%; left: 0; padding-bottom: 10px; font-size: 22px; color: var(--frame-label); white-space: nowrap; cursor: pointer; }
.frame .label code { font: 18px var(--font-mono); color: var(--muted); margin-left: 10px; }
.frame iframe { display: block; border: 0; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 8px 30px rgba(0,0,0,.08); pointer-events: none; }
.frame:hover iframe { outline: 4px solid var(--accent); }
.toolbar { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.toolbar button { border: 0; background: none; color: var(--ink); font: 12px var(--font-ui); padding: 6px 10px; border-radius: 5px; cursor: pointer; }
.toolbar button:hover, .toolbar button:focus-visible { background: color-mix(in srgb, var(--accent) 14%, transparent); outline: none; }
.toolbar output { font: 12px var(--font-mono); padding: 6px 8px; min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.hint { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.focus { position: fixed; inset: 0; background: var(--canvas); display: flex; flex-direction: column; z-index: 10; }
.focus header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.focus header strong { font-weight: 600; }
.focus header code { font: 12px var(--font-mono); color: var(--muted); }
.focus header .sp { flex: 1; }
.focus header button { border: 1px solid var(--line); background: var(--canvas); color: var(--ink); border-radius: 6px; padding: 5px 12px; font: inherit; cursor: pointer; }
.focus .scroll { flex: 1; overflow: auto; padding-block: 24px; padding-inline: 16px; }
.focus iframe { display: block; margin: 0 auto; border: 0; background: #fff; box-shadow: 0 2px 20px rgba(0,0,0,.15); max-width: 100%; }
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 38% 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .hint { display: none; }
}
</style>

<div class="app">
  <aside>
    <header>
      <h1>Scrivetta — screens</h1>
      <p>Static snapshots of every page, captured from the running app with sample data. Click a frame to open it at full size.</p>
      <!--__BRIEF__-->
    </header>
    <nav class="layers" id="layers" aria-label="Frames"></nav>
  </aside>
  <main class="stage" id="stage">
    <div class="world" id="world"></div>
    <div class="hint">Drag to pan · Ctrl/⌘ + scroll to zoom · scroll to move</div>
    <div class="toolbar">
      <button id="zout" aria-label="Zoom out">−</button>
      <output id="zoom">25%</output>
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="fit">Fit all</button>
    </div>
  </main>
</div>

<div class="focus" id="focus" hidden>
  <header>
    <strong id="ftitle"></strong><code id="froute"></code>
    <span class="sp"></span>
    <button id="fprev">← Prev</button><button id="fnext">Next →</button><button id="fclose">Close</button>
  </header>
  <div class="scroll"><iframe id="fframe" title="Screen"></iframe></div>
</div>

<script>
const FRAMES = /*__MANIFEST__*/[];

const GAP_X = 120, GAP_Y = 260, SECTION_LABEL = 120;
const world = document.getElementById("world");
const stage = document.getElementById("stage");
const layers = document.getElementById("layers");

// Lay out: one row per section.
const sections = [];
for (const f of FRAMES) {
  let s = sections.find((x) => x.name === f.section);
  if (!s) sections.push((s = { name: f.section, frames: [] }));
  s.frames.push(f);
}
let y = 0, worldW = 0;
for (const s of sections) {
  const t = document.createElement("div");
  t.className = "section-title";
  t.textContent = s.name;
  t.style.left = "0px"; t.style.top = y + "px";
  world.appendChild(t);
  y += SECTION_LABEL + 60;
  let x = 0, rowH = 0;
  const h2 = document.createElement("h2");
  h2.textContent = s.name;
  layers.appendChild(h2);
  for (const f of s.frames) {
    f.x = x; f.y = y;
    const el = document.createElement("div");
    el.className = "frame";
    el.style.left = x + "px"; el.style.top = y + "px";
    el.innerHTML = `<div class="label"></div><iframe loading="lazy" scrolling="no" tabindex="-1"></iframe>`;
    el.querySelector(".label").textContent = f.title;
    const code = document.createElement("code");
    code.textContent = `${f.route} · ${f.width}px`;
    el.querySelector(".label").appendChild(code);
    const ifr = el.querySelector("iframe");
    ifr.title = f.title;
    ifr.width = f.width; ifr.height = f.height;
    ifr.src = `frames/${f.id}.html`;
    el.addEventListener("click", (e) => { if (!moved) openFocus(f); });
    world.appendChild(el);
    const b = document.createElement("button");
    b.innerHTML = `<span></span><span>${f.width}w</span>`;
    b.firstChild.textContent = f.title;
    b.addEventListener("click", () => zoomTo(f));
    b.addEventListener("dblclick", () => openFocus(f));
    layers.appendChild(b);
    x += f.width + GAP_X;
    rowH = Math.max(rowH, f.height);
  }
  worldW = Math.max(worldW, x);
  y += rowH + GAP_Y;
}
const worldH = y;

// Pan & zoom.
let scale = 0.2, tx = 40, ty = 40, moved = false;
const zoomOut = document.getElementById("zoom");
function apply() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  zoomOut.textContent = Math.round(scale * 100) + "%";
}
function zoomAt(factor, cx, cy) {
  const ns = Math.min(2, Math.max(0.02, scale * factor));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns; apply();
}
function fit() {
  const r = stage.getBoundingClientRect();
  scale = Math.min((r.width - 80) / worldW, (r.height - 80) / worldH);
  tx = 40; ty = 40; apply();
}
function zoomTo(f) {
  const r = stage.getBoundingClientRect();
  scale = Math.min(1, (r.width - 80) / f.width, (r.height - 120) / Math.min(f.height, 2400));
  tx = (r.width - f.width * scale) / 2 - f.x * scale;
  ty = 80 - f.y * scale;
  apply();
}
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, { passive: false });
let drag = null;
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".toolbar")) return;
  drag = { x: e.clientX, y: e.clientY, tx, ty }; moved = false;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; stage.classList.add("dragging"); }
  tx = drag.tx + dx; ty = drag.ty + dy; apply();
});
stage.addEventListener("pointerup", (e) => {
  stage.classList.remove("dragging");
  if (drag && !moved) {
    stage.releasePointerCapture(e.pointerId);
    const el = document.elementsFromPoint(e.clientX, e.clientY).find((n) => n.classList?.contains("frame"));
    if (el) el.click();
  }
  drag = null;
});
document.getElementById("zin").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
document.getElementById("zout").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };
document.getElementById("fit").onclick = fit;

// Focus mode: one frame at real size, scrollable.
const focus = document.getElementById("focus");
const fframe = document.getElementById("fframe");
let current = -1;
function openFocus(f) {
  current = FRAMES.indexOf(f);
  document.getElementById("ftitle").textContent = f.title;
  document.getElementById("froute").textContent = `${f.route} · ${f.width}×${f.height}`;
  fframe.src = `frames/${f.id}.html`;
  fframe.width = f.width; fframe.height = f.height;
  focus.hidden = false;
  focus.querySelector(".scroll").scrollTop = 0;
  history.replaceState(null, "", "#" + f.id);
}
function closeFocus() { focus.hidden = true; history.replaceState(null, "", location.pathname + location.search); }
document.getElementById("fclose").onclick = closeFocus;
document.getElementById("fprev").onclick = () => openFocus(FRAMES[(current - 1 + FRAMES.length) % FRAMES.length]);
document.getElementById("fnext").onclick = () => openFocus(FRAMES[(current + 1) % FRAMES.length]);
document.addEventListener("keydown", (e) => {
  if (focus.hidden) { if (e.key === "0" && (e.ctrlKey || e.metaKey || e.shiftKey)) { e.preventDefault(); fit(); } return; }
  if (e.key === "Escape") closeFocus();
  if (e.key === "ArrowRight") document.getElementById("fnext").click();
  if (e.key === "ArrowLeft") document.getElementById("fprev").click();
});

// Open at a readable zoom on the first row; "Fit all" shows everything.
scale = 0.16; apply();
const deep = FRAMES.find((f) => "#" + f.id === location.hash);
if (deep) openFocus(deep);
</script>
